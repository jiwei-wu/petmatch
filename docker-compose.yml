services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: petmatch
      POSTGRES_USER: petmatch
      POSTGRES_PASSWORD: petmatch_dev
    ports:
      - "5432:5432"
    volumes:
      - petmatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmatch -d petmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petmatch
      SPRING_DATASOURCE_USERNAME: petmatch
      SPRING_DATASOURCE_PASSWORD: petmatch_dev
      # Local demo default only. Set JWT_SECRET in your shell to use your own (32+ characters).
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-please-change-me-0123456789}
    restart: unless-stopped

volumes:
  petmatch-pgdata: