name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The integration tests start their own PostGIS container (Testcontainers),
      # so no database service is configured here.
      - name: Build and test
        run: ./mvnw -B verify
